{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="card card-cp border-0 shadow-sm p-4">
      <div class="card-body">
        <div class="display-1 text-primary fw-bold mb-2">404</div>
        <h3 class="fw-bold mb-2">Page or Document Not Found</h3>
        <p class="text-secondary small mb-4">
          The requested page or resume document could not be located. It may have been deleted, or the URL address was altered.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-cp-primary">
          <i class="bi bi-house me-1"></i>Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
